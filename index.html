<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gourmet Discovery: Pixel Edition</title>
    <!-- NES.css -->
    <link href="https://unpkg.com/nes.css@2.3.0/css/nes.min.css" rel="stylesheet" />
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DotGothic16&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="container">
        <header style="margin-bottom: 2rem; text-align: center;">
            <i class="nes-icon star is-large"></i>
            <h1>Kitchen RPG</h1>
            <p>Quest: Find the Recipe</p>
        </header>

        <section class="nes-container with-title is-centered">
            <p class="title">Inventory Search</p>
            <div class="search-box">
                <div class="nes-field is-inline">
                    <input type="text" id="searchInput" class="nes-input" placeholder="Name of ingredient...">
                    <button id="searchBtn" class="nes-btn is-primary">Hit!</button>
                </div>
            </div>
        </section>

        <!-- HP Bar Loader (Hidden by default) -->
        <div id="loadingBar" class="nes-container is-rounded" style="display: none; margin-top: 2rem;">
            <p>Loading Data...</p>
            <progress class="nes-progress is-success" value="0" max="100"></progress>
        </div>

        <main id="recipeContainer" class="recipe-grid" style="margin-top: 3rem;">
            <!-- Results will appear here -->
            <div class="nes-container is-dark with-title">
                <p class="title">Log</p>
                <p>Waiting for quest input...</p>
            </div>
        </main>

        <footer style="margin-top: 3rem; text-align: center;">
            <p class="nes-text is-disabled">Designed & Built by Julius Pelegrino</p>
        </footer>
    </div>

    <!-- Floating Icons Container -->
    <div id="emoji-container"></div>

    <script src="script.js"></script>
</body>
</html>
